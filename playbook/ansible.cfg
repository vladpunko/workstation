[defaults]
# Set the default inventory file to use on the current machine.
inventory = hosts

# Let Ansible discover the preferred local Python interpreter without noisy
# warnings on the current machine.
interpreter_python = auto_silent

# Prevent retry files from cluttering this working repository.
retry_files_enabled = False

# Use a compact stdout callback so local provisioning output is easier to scan
# on the current machine.
stdout_callback = community.general.unixy

# This playbook intentionally targets `localhost`.
localhost_warning = False
