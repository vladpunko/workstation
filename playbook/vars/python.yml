---
miniconda_version: 25.5.1-1

# Set the preferred version of the main python interpreter on the current machine.
# See information: https://repo.anaconda.com/miniconda
miniconda_python_version: py313

# Download the installer for this system.
miniconda_installer_url: >-
  https://repo.anaconda.com/miniconda/Miniconda3-{{ miniconda_python_version }}_{{ miniconda_version }}-Linux-x86_64.sh

# Verify the downloaded installer before running it.
miniconda_installer_checksum: sha256:612af113b49db0368e2be41ac4d51b7088eebd5f31daeeb89f23fff8f920db58

# Install these tools in the Miniconda base environment.
required_python_packages:
  - "jupyter>=1.1.0"
  - "jupyterlab>=4.4.0"
  - auditwheel
  - psutil
  - sshuttle
  - twine
  - virtualenv
  - virtualenvwrapper

# Keep `pyenv` on a reviewed revision when provisioning the workstation.
pyenv_revision: 6b38999a6051714adf5f3c36d6452c4b67e4fffc
