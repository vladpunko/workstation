---
gnome_settings:
  # Set the main encoding for the current operating system.
  /system/locale/region: "'en_US.UTF-8'"

  # Use this extension to show icons in the tray bar.
  # See information: https://github.com/ubuntu/gnome-shell-extension-appindicator
  /org/gnome/shell/enabled-extensions: "['appindicatorsupport@rgcjonas.gmail.com']"

  # Keep frequently used applications in the dock.
  /org/gnome/shell/favorite-apps: >-
    ['org.gnome.Nautilus.desktop',
    'org.gnome.Ptyxis.desktop',
    'chromium-browser.desktop',
    'net.thunderbird.Thunderbird.desktop',
    'code.desktop',
    'org.gnome.TextEditor.desktop']

  # Prefer performance over power savings.
  /org/gnome/shell/last-selected-power-profile: "'performance'"

  # Avoid interruptions during long work sessions.
  /org/gnome/settings-daemon/plugins/power/idle-dim: "false"
  /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-timeout: "7200"
  /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-timeout: "1800"

  # Make hidden files and directories easier to find.
  /org/gtk/gtk4/settings/file-chooser/show-hidden: "true"
  /org/gtk/gtk4/settings/file-chooser/sort-directories-first: "true"

  # Show the remaining battery charge without opening the system menu.
  /org/gnome/desktop/interface/show-battery-percentage: "true"

  # Avoid recording recent files or sending problem reports.
  /org/gnome/desktop/privacy/remember-recent-files: "false"
  /org/gnome/desktop/privacy/report-technical-problems: "false"

  # Keep the time zone under manual control.
  /org/gnome/desktop/datetime/automatic-timezone: "false"

  # Bind a key to switch languages quickly.
  /org/gnome/desktop/input-sources/xkb-options: "['grp:caps_toggle', 'grp:shift_caps_toggle']"

  # Keep keyboard layout changes consistent across all windows.
  /org/gnome/desktop/input-sources/per-window: "false"
  /org/gnome/desktop/input-sources/current: "uint32 0"
  /org/gnome/desktop/input-sources/mru-sources: "[('xkb', 'us'), ('xkb', 'ru')]"
  /org/gnome/desktop/input-sources/sources: "[('xkb', 'us'), ('xkb', 'ru')]"

  # Keep applications from using system location services.
  /org/gnome/system/location/enabled: "false"

  # Keep notifications private while the screen is locked.
  /org/gnome/desktop/notifications/show-in-lock-screen: "false"

  # Prevent removable media from starting programs automatically.
  /org/gnome/desktop/media-handling/autorun-never: "true"

  # Keep terminal sessions quiet and predictable.
  /org/gnome/Ptyxis/audible-bell: "false"
  /org/gnome/Ptyxis/default-profile-uuid: "'4bf9765b7b28053097d88b8c68ae069b'"
  /org/gnome/Ptyxis/profile-uuids: "['4bf9765b7b28053097d88b8c68ae069b']"
  /org/gnome/Ptyxis/restore-session: "false"
  /org/gnome/Ptyxis/restore-window-size: "false"
  /org/gnome/Ptyxis/scrollbar-policy: "'never'"
  /org/gnome/Ptyxis/visual-bell: "false"
  /org/gnome/Ptyxis/window-size: "(uint32 200, uint32 50)"

  # Keep earlier command output available for inspection.
  /org/gnome/Ptyxis/Profiles/4bf9765b7b28053097d88b8c68ae069b/limit-scrollback: "false"
  /org/gnome/Ptyxis/Profiles/4bf9765b7b28053097d88b8c68ae069b/login-shell: "false"
  /org/gnome/Ptyxis/Profiles/4bf9765b7b28053097d88b8c68ae069b/palette: "'Dark Pastel'"

  # Avoid opening the terminal menu with an accidental key press.
  /org/gnome/Ptyxis/Shortcuts/primary-menu: "''"
