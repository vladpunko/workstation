---
- name: Provision the local workstation
  hosts: localhost
  gather_facts: true

  vars_files:
    - vars/system_packages.yml
    - vars/python.yml
    - vars/dotfiles.yml
    - vars/vscode_extensions.yml
    - vars/user_programs.yml
    - vars/user_services.yml
    - vars/gnome_settings.yml

  pre_tasks:
    - name: Check the workstation platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ansible_facts.distribution_major_version == fedora_version
          - ansible_facts.architecture == "x86_64"
        fail_msg: "Run this playbook on Fedora {{ fedora_version }} with an x86_64 processor."
        quiet: true
      tags: always

    - name: Check the invoking user
      ansible.builtin.assert:
        that: ansible_facts.user_uid != 0
        fail_msg: Run the playbook from your regular user account.
        quiet: true
      tags: always

  tasks:
    - name: Include system package tasks
      ansible.builtin.import_tasks: tasks/system_packages.yml

    - name: Include Python tasks
      ansible.builtin.import_tasks: tasks/python.yml

    - name: Include workspace tasks
      ansible.builtin.import_tasks: tasks/user_workspace.yml

    - name: Set the user's default shell
      # Use the installed shell configuration in new sessions.
      become: true
      ansible.builtin.user:
        name: "{{ user }}"
        shell: /usr/bin/zsh
      # A preview may run before the shell package is installed.
      when: not ansible_check_mode or '/usr/bin/zsh' is file
      tags:
        - dotfiles
        - dotfiles-workstation

    - name: Set up Docker for the current user
      # Changing system groups and services requires administrator privileges.
      become: true
      tags:
        - docker
        - docker-workstation
      block:
        - name: Create the Docker group
          # The daemon's socket uses this group for user access.
          ansible.builtin.group:
            name: docker
            state: present

        - name: Grant the current user access to Docker
          ansible.builtin.user:
            name: "{{ user }}"
            groups: docker
            # Preserve the user's other group memberships.
            append: true

        - name: Start Docker and enable it at boot
          # Keep Docker available after a system restart.
          ansible.builtin.systemd_service:
            name: docker.service
            enabled: true
            state: started
          when: ansible_facts.service_mgr == "systemd"

    - name: Include GNOME desktop tasks
      ansible.builtin.import_tasks: tasks/gnome_desktop.yml

    - name: Include user program tasks
      ansible.builtin.import_tasks: tasks/user_programs.yml

    - name: Include user service tasks
      ansible.builtin.import_tasks: tasks/user_services.yml
