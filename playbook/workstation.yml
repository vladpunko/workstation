---
- name: Provision the local workstation
  hosts: localhost
  gather_facts: true

  vars_files:
    - vars/system_packages.yml
    - vars/python.yml
    - vars/dotfiles.yml
    - vars/vscode_extensions.yml
    - vars/user_programs.yml
    - vars/user_services.yml
    - vars/gnome_settings.yml

  pre_tasks:
    - name: Check the workstation platform
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ansible_facts.distribution_major_version == fedora_version
          - ansible_facts.architecture == "x86_64"
        fail_msg: "Run this playbook on Fedora {{ fedora_version }} with an x86_64 processor."
        quiet: true
      tags: always

    - name: Check the invoking user
      ansible.builtin.assert:
        that: ansible_facts.user_uid != 0
        fail_msg: Run the playbook from your regular user account.
        quiet: true
      tags: always

  tasks:
    - name: Include system package tasks
      ansible.builtin.import_tasks: tasks/system_packages.yml

    - name: Include Python tasks
      ansible.builtin.import_tasks: tasks/python.yml

    - name: Include workspace tasks
      ansible.builtin.import_tasks: tasks/user_workspace.yml

    - name: Include desktop tasks
      ansible.builtin.import_tasks: tasks/desktop.yml

    - name: Include user program tasks
      ansible.builtin.import_tasks: tasks/user_programs.yml

    - name: Include user service tasks
      ansible.builtin.import_tasks: tasks/user_services.yml
