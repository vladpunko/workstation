---
- name: Install the user's configuration files
  # Keep personal configuration editable without administrator privileges.
  become: true
  become_user: "{{ user }}"
  tags:
    - dotfiles
    - dotfiles-workstation
  environment:
    HOME: "{{ user_home }}"
  block:
    # A directory destination would make `copy` use a different filename.
    - name: Check the destinations of the configuration files
      ansible.builtin.stat:
        path: "{{ item.dest }}"
        follow: true
        get_checksum: false
      loop: "{{ dotfiles }}"
      loop_control:
        label: "{{ item.dest }}"
      register: configuration_destinations

    - name: Stop if a directory blocks a configuration file
      ansible.builtin.assert:
        that: not (item.stat.isdir | default(false))
        fail_msg: >-
          The destination `{{ item.item.dest }}` is a directory.
          Move it aside and run this playbook again.
        quiet: true
      loop: "{{ configuration_destinations.results }}"
      loop_control:
        label: "{{ item.item.dest }}"

    - name: Check which configuration directories already exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ dotfiles | map(attribute='dest') | map('dirname') | unique(case_sensitive=true) }}"
      register: dotfile_directories

    # Existing directories may have permissions needed by other applications.
    - name: Create any missing configuration directories
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        recurse: false
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0700"
      loop: "{{ dotfile_directories.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Copy the configuration files into place
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        backup: true
        follow: false
        mode: "0600"
      with_items: "{{ dotfiles }}"

- name: Configure the code editor
  # Install extensions for the user who runs the editor.
  become: true
  become_user: "{{ user }}"
  tags:
    - vscode
    - vscode-workstation
  environment:
    HOME: "{{ user_home }}"
    # Keep inherited settings from switching editor instances or profile directories.
    VSCODE_IPC_HOOK_CLI: ""
    VSCODE_APPDATA: ""
    VSCODE_EXTENSIONS: ""
    VSCODE_PORTABLE: ""
    VSCODE_DEV: ""
  vars:
    # Use the application's own CLI so manual installations work without a Homebrew link.
    code_editor_executable: "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"

    # The editor treats differently capitalized extension identifiers as equal.
    requested_extensions: "{{ required_vscode_extensions | map('lower') | list }}"
    normalized_installed_extensions: >-
      {{ installed_vscode_extensions.stdout_lines | default([]) | map('lower') | list }}

    # Avoid reinstalling existing extensions and keep the installation order predictable.
    missing_vscode_extensions: >-
      {{ requested_extensions | difference(normalized_installed_extensions) | sort }}
  when: required_vscode_extensions | length > 0
  block:
    # The editor may be missing when previewing the setup of a new system.
    - name: Check whether the code editor is installed
      ansible.builtin.stat:
        path: "{{ code_editor_executable }}"
        follow: true
        get_checksum: false
      register: code_editor_command

    - name: List the extensions installed in the code editor
      ansible.builtin.command:
        argv:
          - "{{ code_editor_executable }}"
          - --list-extensions
      register: installed_vscode_extensions
      changed_when: false
      check_mode: false
      failed_when:
        - installed_vscode_extensions.rc != 0
        - not ansible_check_mode or code_editor_command.stat.exists

    - name: Show which extensions will be installed in the code editor
      ansible.builtin.debug:
        msg: "The code editor will install the `{{ item }}` extension."
      changed_when: true
      loop: "{{ missing_vscode_extensions }}"
      when: ansible_check_mode

    - name: Install missing extensions in the code editor
      ansible.builtin.command:
        argv:
          - "{{ code_editor_executable }}"
          - --install-extension
          - "{{ item }}"
      changed_when: true
      loop: "{{ missing_vscode_extensions }}"
      when: not ansible_check_mode
