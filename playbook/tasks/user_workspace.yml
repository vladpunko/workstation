---
- name: Load dotfile variables
  ansible.builtin.include_vars: vars/dotfiles.yml

- name: Load Visual Studio Code extension variables
  ansible.builtin.include_vars: vars/vscode_extensions.yml

- name: Install user dotfiles
  when: ansible_distribution == "MacOSX"
  tags:
    - dotfiles
    - dotfiles-workstation
  block:
    - name: Create the parent directories for all dotfiles
      ansible.builtin.file:
        path: "{{ item.dest | dirname }}"
        state: directory
        recurse: false
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0700"
      with_items: "{{ dotfiles }}"

    - name: Copy the managed dotfiles
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0600"
      with_items: "{{ dotfiles }}"

- name: Provision the Visual Studio Code environment
  when: ansible_distribution == "MacOSX"
  tags:
    - vscode
    - vscode-workstation
  block:
    - name: Install the required Visual Studio Code extensions
      environment:
        # Include both Homebrew prefixes in `PATH` so the playbook works on
        # Intel and Apple Silicon Macs.
        PATH: "/opt/homebrew/bin:/usr/local/bin:{{ lookup('ansible.builtin.env', 'PATH') }}"
      ansible.builtin.command: code --force --install-extension "{{ item }}"
      changed_when: true
      with_items: "{{ required_vscode_extensions }}"
