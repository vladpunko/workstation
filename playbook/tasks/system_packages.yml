---
- name: Install applications and command-line tools
  # Homebrew must run as the user who owns its installation.
  become: true
  become_user: "{{ user }}"
  tags:
    - packages
    - packages-workstation
  environment:
    HOME: "{{ user_home }}"
  block:
    - name: Install desktop applications
      vars:
        # Keep manually installed applications from being installed again.
        applications_to_install: >-
          {{ (homebrew_applications.stdout | from_json).casks
             | rejectattr('installed')
             | rejectattr('bundle_version')
             | rejectattr('bundle_short_version')
             | map(attribute='token')
             | list }}
      when: required_homebrew_casks | length > 0
      block:
        - name: Read the application installation details
          ansible.builtin.command:
            argv: >-
              {{ ['/opt/homebrew/bin/brew', 'info', '--json=v2', '--cask'] + required_homebrew_casks }}
          register: homebrew_applications
          changed_when: false
          check_mode: false

        - name: Install the required applications
          community.general.homebrew_cask:
            name: "{{ applications_to_install }}"
            path: /opt/homebrew/bin
            state: present
            accept_external_apps: true
            sudo_password: "{{ ansible_become_password }}"
          when: applications_to_install | length > 0

    - name: Install command-line tools and libraries
      community.general.homebrew:
        name: "{{ required_homebrew_packages }}"
        path: /opt/homebrew/bin
        state: present
      when: required_homebrew_packages | length > 0

    - name: Configure the virus scanner
      when: "'clamav' in required_homebrew_packages"
      block:
        # A directory destination would make `copy` write under a different filename.
        - name: Check the virus scanner's configuration path
          ansible.builtin.stat:
            path: /opt/homebrew/etc/clamav/freshclam.conf
            follow: true
            get_checksum: false
          register: clamav_configuration

        - name: Check for conflicts at the virus scanner's configuration path
          ansible.builtin.assert:
            that: >-
              not clamav_configuration.stat.exists
              or (clamav_configuration.stat.isreg | default(false))
            fail_msg: >-
              The virus scanner cannot use `/opt/homebrew/etc/clamav/freshclam.conf` as a configuration file.
              Move it aside and run this playbook again.
            quiet: true

        - name: Create the virus scanner's configuration directory
          ansible.builtin.file:
            path: /opt/homebrew/etc/clamav
            state: directory
            mode: "0755"

        # Homebrew's sample configuration does not enable virus definition updates.
        - name: Configure virus definition updates
          ansible.builtin.copy:
            dest: /opt/homebrew/etc/clamav/freshclam.conf
            content: |
              DatabaseMirror database.clamav.net
              DNSDatabaseInfo current.cvd.clamav.net
              DatabaseDirectory /opt/homebrew/var/lib/clamav
            # Preserve any configuration the user has already customized.
            force: false
            follow: true
            mode: "0644"
