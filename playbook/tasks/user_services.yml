---
- name: Install and start user services
  # Services and their configuration belong to the user who runs them.
  become: true
  become_user: "{{ user }}"
  tags:
    - services
    - services-workstation
  environment:
    HOME: "{{ user_home }}"
  when: required_user_services | length > 0
  block:
    # User services need a desktop session before they can be loaded.
    - name: Check the desktop session and its disabled services
      ansible.builtin.command:
        argv:
          - /bin/launchctl
          - print-disabled
          - "{{ services_domain }}"
      register: disabled_services
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require a desktop session for user services
      ansible.builtin.assert:
        that: disabled_services.rc == 0
        fail_msg: >-
          User services need an active macOS desktop session.
          Sign in to your account and run this playbook from a terminal window.
        quiet: true

    - name: Configure each user service
      ansible.builtin.include_tasks: user_service.yml
      loop: "{{ required_user_services }}"
      loop_control:
        loop_var: service
        label: "{{ service.src | basename }}"
