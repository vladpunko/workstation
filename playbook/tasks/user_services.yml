---
- name: Install and start user services
  # Services and their configuration belong to the user who runs them.
  become: true
  become_user: "{{ user }}"
  environment:
    HOME: "{{ user_home }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path={{ user_runtime_directory }}/bus"
    XDG_RUNTIME_DIR: "{{ user_runtime_directory }}"
  tags:
    - services
    - services-workstation
  when: required_user_services | length > 0
  block:
    # A socket file alone does not prove that the user service manager is available.
    - name: Check the user service manager
      ansible.builtin.command:
        argv: [/usr/bin/systemctl, --user, show, --property=Version, --value]
      register: service_manager
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Require a user session
      ansible.builtin.assert:
        that: service_manager.rc == 0
        fail_msg: Sign in to your desktop account before configuring user services.
        quiet: true
      when: not ansible_check_mode

    - name: Configure each user service
      ansible.builtin.include_tasks: user_service.yml
      loop: "{{ required_user_services }}"
      loop_control:
        loop_var: service
        label: "{{ service.name }}"
