---
- name: Load user service variables
  ansible.builtin.include_vars: vars/user_services.yml

- name: Install and start user services
  when: ansible_distribution == "MacOSX"
  tags:
    - services
    - services-workstation
  block:
    - name: Define the LaunchAgents directory
      ansible.builtin.set_fact:
        services_location: ~/Library/LaunchAgents

    - name: Create the LaunchAgents directory
      ansible.builtin.file:
        path: "{{ services_location }}"
        state: directory
        recurse: false
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0755"

    - name: Install the required user services
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ services_location }}"
        owner: "{{ user }}"
        group: "{{ group }}"
        mode: "0644"
      loop_control:
        label: "{{ item | basename }}"
      with_items: "{{ required_user_services }}"

    - name: Gather labels for each launch agent
      # `launchctl list` works with service labels, so read the label from each
      # plist first.
      ansible.builtin.command: "/usr/libexec/PlistBuddy -c 'Print Label' {{ services_location }}/{{ item | basename }}"
      register: user_service_labels
      changed_when: false
      loop_control:
        label: "{{ item | basename }}"
      with_items: "{{ required_user_services }}"

    - name: Check whether each launch agent is already running
      ansible.builtin.command: "launchctl list {{ user_service_labels.results[service_index].stdout }}"
      register: user_service_statuses
      changed_when: false
      failed_when: false # do not fail when `launchctl list` reports a missing agent
      loop_control:
        index_var: service_index
        label: "{{ item | basename }}"
      with_items: "{{ required_user_services }}"

    - name: Load and start the missing launch agents
      ansible.builtin.shell: |
        launchctl load -w {{ services_location }}/{{ item | basename }}

        # Trigger the service immediately after `launchctl load -w`.
        launchctl start {{ user_service_labels.results[service_index].stdout }}
      register: service_bootstrap_status
      changed_when: service_bootstrap_status.rc == 0
      failed_when: service_bootstrap_status.rc > 0
      when: user_service_statuses.results[service_index].rc != 0
      loop_control:
        index_var: service_index
        label: "{{ item | basename }}"
      with_items: "{{ required_user_services }}"
