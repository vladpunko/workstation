---
- name: Install Python tools and packages
  # Keep personal tools writable without elevated permissions.
  become: true
  become_user: "{{ user }}"
  tags:
    - python
    - python-workstation
  environment:
    HOME: "{{ user_home }}"
    # Avoid importing packages from another Python environment.
    PYTHONHOME: ""
    PYTHONPATH: ""
    PYTHONNOUSERSITE: "1"

    # Packages must stay in Miniconda even when another environment is active.
    PIP_CONFIG_FILE: /dev/null
    PIP_DRY_RUN: "false" # leave preview mode to Ansible
    # Both aliases can disable dependencies, so reset them together.
    PIP_NO_DEPS: "false"
    PIP_NO_DEPENDENCIES: "false"
    PIP_REQUIRE_VIRTUALENV: "false"
    PIP_USER: "false"
    PIP_TARGET: ""
    PIP_PREFIX: ""
    PIP_ROOT: ""
    PIP_PYTHON: ""
  block:
    # Missing tools are expected on a fresh system.
    # Previews still need these checks to determine whether installation is required.
    - name: Check whether Miniconda is available
      ansible.builtin.command:
        argv:
          - "{{ miniconda_location }}/bin/conda"
          - --version
      register: miniconda
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Check whether `pip` is available in Miniconda
      ansible.builtin.command:
        argv:
          - "{{ miniconda_location }}/bin/pip"
          - --version
      register: miniconda_pip
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Set up Miniconda if it is unavailable
      when: miniconda.rc != 0 or miniconda_pip.rc != 0
      block:
        - name: Check the Miniconda directory
          ansible.builtin.stat:
            path: "{{ miniconda_location }}"
            follow: false # broken symbolic links also block installation
          register: miniconda_directory

        # An existing directory may contain user environments that must be preserved.
        - name: Stop if the Miniconda directory already exists
          ansible.builtin.assert:
            that: not miniconda_directory.stat.exists
            fail_msg: >-
              Miniconda or `pip` could not start from the existing installation.
              Rename the directory at `{{ miniconda_location }}` and run the playbook again.
            quiet: true

        - name: Show the planned Miniconda installation
          ansible.builtin.debug:
            msg: Miniconda and the required Python packages will be installed.
          changed_when: true # include the pending installation in the preview summary
          when: ansible_check_mode

        - name: Download and install Miniconda
          when: not ansible_check_mode
          block:
            # A unique file keeps downloads and cleanup away from existing user files.
            - name: Create a temporary file for the Miniconda installer
              ansible.builtin.tempfile:
                state: file
                # The installer requires a `.sh` extension to run.
                suffix: .sh
              register: miniconda_installer

            - name: Download the Miniconda installer
              ansible.builtin.get_url:
                url: "{{ miniconda_installer_url }}"
                checksum: "{{ miniconda_installer_checksum }}"
                dest: "{{ miniconda_installer.path }}"
                timeout: 600 # allow the large installer to download on slower connections
                owner: "{{ user }}"
                group: "{{ group }}"
                mode: "0600"

            - name: Install Miniconda from the downloaded installer
              ansible.builtin.command:
                argv:
                  - /bin/bash
                  - "{{ miniconda_installer.path }}"
                  - -b
                  - -p
                  - "{{ miniconda_location }}"
              changed_when: true
          always:
            - name: Delete the downloaded Miniconda installer
              ansible.builtin.file:
                path: "{{ miniconda_installer.path }}"
                state: absent
              when: miniconda_installer.path is defined

    - name: Install `pyenv` to manage Python versions
      ansible.builtin.git:
        repo: https://github.com/pyenv/pyenv.git
        version: "{{ pyenv_revision }}"
        dest: "{{ pyenv_location }}"

    # A preview can inspect packages only when Miniconda is already available.
    - name: Install the required Python packages
      ansible.builtin.pip:
        executable: "{{ miniconda_location }}/bin/pip"
        name: "{{ required_python_packages }}"
        state: present
      when: not ansible_check_mode or (miniconda.rc == 0 and miniconda_pip.rc == 0)
